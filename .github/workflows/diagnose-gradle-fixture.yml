name: Diagnose Gradle fixture
on:
  push:
    branches: [diag/gradle-windows-lifecycle]
permissions:
  contents: read
jobs:
  fixture:
    if: github.repository == 'principalwater/openidea'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build only the fixture's crate
        shell: pwsh
        run: |
          $artifacts = cargo test -p ide-build --lib --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = $artifacts | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.executable -and $_.target.name -eq 'ide_build' } | Select-Object -First 1 -ExpandProperty executable
          if (-not (Test-Path $binary)) { throw 'Missing fixture executable' }
          "FIXTURE_BINARY=$binary" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Observe the two Gradle fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = $env:FIXTURE_BINARY
          $names = @('builds_gradle_projects_with_javac_and_only_what_changed', 'leaves_gradle_projects_with_other_compilers_to_gradle')
          if (-not (Get-Command gradle) -or -not (Test-Path "$env:JAVA_HOME/bin/java.exe")) { throw 'Missing fixture toolchain' }
          $env:GRADLE_USER_HOME = Join-Path $env:RUNNER_TEMP 'gradle-fixture-home'
          for ($iteration = 1; $iteration -le 3; $iteration++) {
            $children = @()
            foreach ($name in $names) {
              $children += Start-Process -FilePath $binary -ArgumentList @("jbuild::tests::$name",'--exact','--nocapture') -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP/$name-out.txt" -RedirectStandardError "$env:RUNNER_TEMP/$name-err.txt"
            }
            foreach ($child in $children) { if (-not $child.WaitForExit(240000)) { throw "Test still running in iteration $iteration" } }
            foreach ($name in $names) {
              $log = Get-Content "$env:RUNNER_TEMP/$name-out.txt" -Raw
              Write-Host "$iteration $name $log"
              if ($log -notmatch '1 passed; 0 failed' -or (Select-String 'skipped: needs' "$env:RUNNER_TEMP/$name-err.txt" -Quiet)) { throw 'Expected an executed, passing fixture' }
            }
            foreach ($child in $children) { if ($child.ExitCode -ne 0) { throw "Exit $($child.ExitCode)" } }
          }
          $status = (& gradle --status | Out-String)
          if ($LASTEXITCODE -ne 0 -or $status -match '(?m)^\s*\d+\s+(IDLE|BUSY)') { throw $status }
          Write-Host $status
