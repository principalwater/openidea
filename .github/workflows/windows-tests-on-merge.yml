name: Full Windows test suite on the merged tree
on:
  push:
    branches: [diag/verify-open-pr-ci-20261125]
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Line tables keep test backtraces readable; full debuginfo only adds build time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, sha: "a56add66ea8bda64c8568fb7d990fa6963544986" }
    # Self-hosted runners (scripts/selfhost-runner) only for trusted events, and only while the
    # SELFHOSTED_RUNNERS repository variable is 'true': runs-on cannot fall back when none is online.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && vars.SELFHOSTED_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "openidea-selfhosted"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: l0ng-ai/openidea
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ${{ runner.environment != 'self-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      # Self-hosted runners keep persistent local Cargo caches; GitHub-hosted runners use Actions cache
      # (only main saves it because saving takes minutes on Windows; PRs restore main's).
      - uses: Swatinem/rust-cache@v2
        if: runner.environment != 'self-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The persistent target dir makes incremental builds pay off; cap its size so it can't fill the disk.
      - name: Persistent Cargo target dir
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          echo "CARGO_INCREMENTAL=1" >> "$GITHUB_ENV"
          size=$(du -sm "$CARGO_TARGET_DIR" 2>/dev/null | cut -f1 || true)
          if [ "${size:-0}" -gt 40000 ]; then
            echo "$CARGO_TARGET_DIR is ${size} MB; clearing it"
            rm -rf "$CARGO_TARGET_DIR"
          fi
      - uses: taiki-e/install-action@nextest
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          pkgs=(libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf)
          dpkg -s "${pkgs[@]}" >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y "${pkgs[@]}"; }
      # tauri-build checks that frontendDist exists.
      - run: pnpm install --frozen-lockfile && mkdir -p dist
        shell: bash
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # Clippy runs in the unchanged CI job; give this cold runner its full slot for tests.
      # Test fixtures write LF files; keep Git from converting them on checkout.
      - run: git config --global core.autocrlf false
      - run: cargo nextest run --workspace --no-fail-fast
      - name: Remote backend with Docker Compose
        # Self-hosted runner containers do not mount /var/run/docker.sock (scripts/selfhost-runner/README.md).
        if: runner.os == 'Linux' && runner.environment != 'self-hosted'
        run: |
          docker pull busybox:latest
          cargo nextest run -p ide-host --test remote_daemon --run-ignored only \
            -E 'test(=compose_service_survives_disconnect_and_is_removed_on_stop)'
      # nextest skips doctests; ide-command's are its compile-fail tests.
      - if: runner.os == 'Linux'
        run: cargo test --doc -p ide-command
      # nextest ran export_bindings, which rewrites src/bindings.ts and the command snapshot.
      - name: Bindings and command snapshot are up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code src/bindings.ts src-tauri/tests/commands.snap
